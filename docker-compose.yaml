services:
  postgres:
    image: postgres:16
    container_name: postgres-thecoffeetaster
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_thecoffeetaster:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d coffee_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:8.3.8
    container_name: mongodb-thecoffeetaster
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data_thecoffeetaster:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 5
  thecoffeetaster:
    container_name: "thecoffeetaster_backend"
    build:
      context: .
      dockerfile: Dockerfile
    image: thecoffeetaster:latest
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
volumes:
  mongodb_data_thecoffeetaster:
  postgres_data_thecoffeetaster: