spring.application.name=thecoffeetaster

# ============================================================
# DataSource Configuration - PostgreSQL Connection
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/thecoffeetaster
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA/Hibernate Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ============================================================
# Flyway Database Migration Configuration
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baselineOnMigrate=true

# ============================================================
# JWT Authentication Configuration
# Use environment variables for production, defaults for development
# ============================================================
jwt.secret=${JWT_SECRET:dev-secret-key-for-local-testing-only}
jwt.access-token-expiry=900
jwt.refresh-token-expiry=604800

# ============================================================
# Email Configuration
# Configured for Gmail SMTP by default
# Use environment variables for actual credentials
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================================
# Rate Limiting Configuration
# ============================================================
auth.rate-limit.requests-per-minute=10
